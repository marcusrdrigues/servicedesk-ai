# Perfil de teste: todos os valores são fictícios. Nenhum teste fala com provedor real nem lê o .env do desenvolvedor.
spring:
  config:
    import: ""
  # Sem banco nos testes que não são de auditoria: a autoconfiguração é excluída e a auditoria fica desligada.
  # Os testes com PostgreSQL real ativam o perfil auditoria-it, que traz a autoconfiguração de volta.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  datasource:
    password: senha-de-teste
  rabbitmq:
    addresses: amqp://teste:teste@localhost:5672
    listener:
      simple:
        auto-startup: false

management:
  health:
    rabbit:
      enabled: false

servicedesk:
  api-key: chave-de-teste-0123456789
  cors-origem: https://portal.exemplo.local
  limite-requisicoes-por-minuto: 1000
  notificacao:
    destinatario: suporte@exemplo.local
    remetente: servicedesk@exemplo.local
  email:
    modo: smtp
  ia:
    openai:
      api-key: chave-openai-de-teste
      modelo: modelo-openai-de-teste
    gemini:
      api-key: chave-gemini-de-teste
      modelo: modelo-gemini-de-teste
