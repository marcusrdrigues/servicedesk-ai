# CI do ServiceDesk AI. O deploy do backend no Render usa autoDeployTrigger: checksPass (render.yaml), então só
# publica depois que estes jobs passam. Ações fixadas pelo SHA do commit do release (versão no comentário).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes, build e imagem Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Os testes de integração usam Testcontainers (RabbitMQ, PostgreSQL, Mailpit); o runner tem Docker.
      # Nenhum teste chama provedor de modelo nem envia e-mail real.
      - name: Testes e compilação
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Validar a construção da imagem Docker
        run: docker build --tag servicedesk-ai:ci .

  portal:
    name: Portal e proxy (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Testes do proxy
        run: node --test
